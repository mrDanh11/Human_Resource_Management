# Application Name
#spring.application.name=human-resource-management
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/hr_management
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # update | create | create-drop | validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

# Server port
server:
  port: 8080

